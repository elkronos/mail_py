name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=email_merge_tool --cov-report=term-missing
      - name: Run examples (offline dry runs)
        shell: bash
        run: |
          python examples/01_quickstart/run.py
          python examples/02_html_newsletter/run.py
          python examples/03_survey_experiment/wave1.py
          python examples/03_survey_experiment/reminder.py
          python examples/03_survey_experiment/analyze.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel and smoke-test the CLI
        run: |
          python -m pip install dist/*.whl
          email-merge --version
